name: Build Confectionery APK V5 Login Sync

on:
  push:
    branches: [confectionery-v5-login-back-sync]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V5 UI navigation and backup patch
        run: python3 .ci/patch_v5_ui.py

      - name: Restore stable prototype signing key
        run: base64 -d .ci/confectionery-test-signing.jks.b64 > confectionery_order_app/ci-test-signing.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: confectionery_order_app
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp confectionery_order_app/app/build/outputs/apk/debug/app-debug.apk Confectionery-Order-Book-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Confectionery-Order-Book-V5-Login-Sync-APK
          path: Confectionery-Order-Book-V5.apk
          if-no-files-found: error
