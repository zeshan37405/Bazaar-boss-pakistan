name: Build Confectionery Order Book V7 Final

on:
  push:
    branches: [confectionery-v7-final]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V5 login navigation foundation
        run: python3 .ci/patch_v5_ui.py

      - name: Repair V5 generated sync screen
        run: python3 .ci/fix_v5_sync_string.py

      - name: Make V6 Kotlin replacements literal-safe
        run: python3 .ci/fix_v6_regex_literal.py

      - name: Apply V6 business workflows
        run: python3 .ci/patch_v6_business.py

      - name: Apply V7 final UX polish
        run: python3 .ci/patch_v7_final.py

      - name: Check sync server JavaScript
        run: node --check confectionery_sync_server/server.js

      - name: Restore stable signing key
        run: base64 -d .ci/confectionery-test-signing.jks.b64 > confectionery_order_app/ci-test-signing.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        working-directory: confectionery_order_app
        env:
          SYNC_BASE_URL: ${{ vars.CONFECTIONERY_SYNC_BASE_URL }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace -PSYNC_BASE_URL="$SYNC_BASE_URL"

      - name: Copy APK
        run: cp confectionery_order_app/app/build/outputs/apk/release/app-release.apk Confectionery-Order-Book-V7-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Confectionery-Order-Book-V7-Final-APK
          path: Confectionery-Order-Book-V7-Final.apk
          if-no-files-found: error
